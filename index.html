<script>
const canvas = document.getElementById('scratchCanvas');
const ctx = canvas.getContext('2d');
const overlayText = document.getElementById('overlayText');

let isDrawing = false;
let unlocked = false;

function setupCanvas() {
    // Pega o tamanho exato do contêiner wrapper
    const container = canvas.parentElement;
    canvas.width = container.offsetWidth;
    canvas.height = container.offsetHeight;

    // Criar a tinta da raspadinha (cinza premium)

    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Configura para "apagar" o que for desenhado
    ctx.globalCompositeOperation = 'destination-out';
}

// Inicializa no load e no resize
window.addEventListener('load', setupCanvas);
window.addEventListener('resize', setupCanvas);

function getPointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
        x: clientX - rect.left,
        y: clientY - rect.top
    };
}

function handleScratch(e) {
    if (!isDrawing || unlocked) return;
    
    // Esconde o texto central assim que começa a raspar
    overlayText.style.opacity = '0';
    
    const { x, y } = getPointerPos(e);
    
    ctx.beginPath();
    ctx.arc(x, y, 35, 0, Math.PI * 2);
    ctx.fill();

    let cleared = 0;
    for (let i = 3; i < data.length; i += 64) { // Pula pixels para performance
        if (data[i] === 0) cleared++;
    }
    
    if (cleared / (data.length / 64) > 0.5) {
        finishReveal();
    }
}

function finishReveal() {

    canvas.style.transition = 'opacity 1s ease';
    canvas.style.opacity = '0';
